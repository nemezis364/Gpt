name: Buduj Roulette Vision APK z ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Rozpakuj projekt
        run: unzip -q RouletteVision_GitHub_AutoAPK.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Buduj APK
        working-directory: RouletteVisionProbe
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RouletteVision-APK
          path: RouletteVisionProbe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
