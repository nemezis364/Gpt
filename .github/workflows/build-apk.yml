name: Buduj Roulette Vision APK z ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4
      - name: Rozpakuj projekt
        run: unzip -q RouletteVision_Stage2_AutoAPK.zip
      - name: Zainstaluj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Przygotuj Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kompiluj instalator APK
        working-directory: RouletteVisionProbe
        run: gradle --no-daemon :app:assembleDebug
      - name: Udostepnij instalator APK
        uses: actions/upload-artifact@v4
        with:
          name: RouletteVision-APK
          path: RouletteVisionProbe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
